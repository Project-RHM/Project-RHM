# Two views of the project on every push and pull request:
#
#   package      what `opam install rhema --with-test` does, from a clean
#                export of generator/ (so a file that is ignored or untracked
#                by mistake fails here, not in the opam repository), on the
#                oldest and the newest supported OCaml, on Linux and macOS.
#   development  the whole tree as a developer builds it: the classic
#                generator too, every test, and the Python checks that drive
#                the rhema command through the web app and the tools.

name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  package:
    name: package (OCaml ${{ matrix.ocaml }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ocaml: ["4.14", "5"]
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml }}
          opam-pin: false

      - name: Install the package's dependencies
        run: opam install ./generator --deps-only --with-test

      # setup-ocaml makes a local switch in the workspace; outside it, opam
      # exec must be told which switch to use, or it exits with code 50.
      - name: Build and test from a clean export, as opam does
        run: |
          rm -rf "$RUNNER_TEMP/export" && mkdir "$RUNNER_TEMP/export"
          git archive HEAD:generator | tar x -C "$RUNNER_TEMP/export"
          cd "$RUNNER_TEMP/export"
          opam exec --switch "$GITHUB_WORKSPACE" -- dune build -p rhema @install @runtest
          opam exec --switch "$GITHUB_WORKSPACE" -- opam lint rhema.opam

      - name: Install into a prefix and run the command from elsewhere
        run: |
          cd "$RUNNER_TEMP/export"
          opam exec --switch "$GITHUB_WORKSPACE" -- dune install --prefix "$RUNNER_TEMP/prefix" rhema
          cd "$RUNNER_TEMP"
          prefix/bin/rhema --version
          prefix/bin/rhema check prefix/share/rhema/*.rhm
          printf 'import "calculus.rhm" as calc\nset s { 2 of calc.integral(cost = 5) }\n' > s.rhm
          prefix/bin/rhema s.rhm --run s -o s.pg && test -s s.pg
          prefix/bin/rhema run prefix/share/rhema/homework_set.rhm --run homework > /dev/null

  development:
    name: development (everything)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5"
          opam-pin: false

      - name: Install the dependencies, including the classic generator's
        run: |
          opam install ./generator --deps-only --with-test
          opam install pprint

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the web app's requirements
        run: pip install -r requirements.txt

      - name: Render the classic generator's config.ml (ignored in git)
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, ".")
          import app
          open("generator/config.ml", "w", encoding="utf-8").write(app.render_ml_config(app.DEFAULT_CONFIG))
          PY

      - name: Build everything and run every suite
        working-directory: generator
        run: |
          opam exec -- dune build
          opam exec -- dune build @rhema/test/runtest --force

      - name: Check and run every library grammar with rhema
        working-directory: generator
        run: |
          R=_build/install/default/bin/rhema
          $R check stdlib/*.rhm
          for f in stdlib/*.rhm; do
            if grep -Eq '^\s*start\s+[A-Za-z_]' "$f"; then $R run "$f" --count 100 > /dev/null; fi
          done
          $R run stdlib/homework_set.rhm --run homework > /dev/null
          $R run stdlib/homework_set.rhm --run quick > /dev/null

      - name: Documentation examples check and run
        run: tools/check_doc_examples.sh generator/_build/install/default/bin/rhema

      - name: Documentation site builds without warnings
        env:
          RHEMA: generator/_build/install/default/bin/rhema
        run: |
          pip install -r docs/requirements.txt
          NO_MKDOCS_2_WARNING=1 mkdocs build --strict

      - name: Python checks that drive rhema
        run: |
          python tools/test_grammar_creation.py
          python tools/rhema_difficulty.py report generator/stdlib/boolean.rhm --at 6 --count 50
          python tools/rhema_stats.py generator/stdlib/boolean.rhm --count 20

      # The site built above is published to Project-RHM/project-rhm.github.io
      # on every push to main, once that repository has a deploy key whose
      # private half is this repository's DOCS_DEPLOY_KEY secret. Without the
      # secret the step is skipped and CI stays green.
      - name: Publish the documentation site
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          DOCS_DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_KEY }}
        run: |
          if [ -z "$DOCS_DEPLOY_KEY" ]; then
            echo "DOCS_DEPLOY_KEY is not set; not publishing."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DOCS_DEPLOY_KEY" > ~/.ssh/docs_deploy
          chmod 600 ~/.ssh/docs_deploy
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/docs_deploy -o IdentitiesOnly=yes"
          git clone --depth 1 git@github.com:Project-RHM/project-rhm.github.io.git "$RUNNER_TEMP/pages"
          cd "$RUNNER_TEMP/pages"
          # The site lives on main; an empty repository gets its first commit there.
          git checkout -q -B main
          git rm -rq --ignore-unmatch . > /dev/null
          cp -R "$GITHUB_WORKSPACE/site/." .
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then
            echo "The site has not changed."
            exit 0
          fi
          git -c user.name="Rhema docs" -c user.email="actions@github.com" \
            commit -q -m "Site from Project-RHM/Project-RHM@${GITHUB_SHA::7}"
          git push -q origin main
          echo "Published https://project-rhm.github.io/"
